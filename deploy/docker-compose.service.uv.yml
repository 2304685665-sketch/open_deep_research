# 尚未在真实 Docker 环境验证。用法：docker compose -f deploy/docker-compose.service.yml up --build
# 需要在 .env 里提供模型相关的 key；SERVICE_API_KEYS 以逗号分隔，留空表示不启用鉴权（仅限本地演示）。
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service.uv
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
