# 本地 PostgreSQL + pgvector（端口 5433，避免和本机已有 Postgres 冲突）。
# 启动：docker compose -f deploy/docker-compose.pgvector.yml up -d
# 连接串（默认值，无需设置）：postgresql://postgres:postgres@localhost:5433/odr
# 镜像拉取慢时先 export HTTP_PROXY/HTTPS_PROXY（见 Docker 构建的处理）。
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: odr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d odr"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
